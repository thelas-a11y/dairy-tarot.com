    <script>
        // =========================================================
        // microCMSの設定情報
        // =========================================================
        const MICROCMS_SERVICE_DOMAIN = 'uge4f6f5lj';
        const MICROCMS_API_KEY = 'Kf8tbnHNXlz52fKZ2Z0mRPF4OnIAwPi0fXbc';
        const ENDPOINT = 'pet';

        const drawButton = document.getElementById('draw-button');
        const resultArea = document.getElementById('result-area');
        const resultTitle = document.getElementById('result-title');
        const resultText = document.getElementById('result-text');
        const cardImg = document.getElementById('card-img-0');

        // ボタンが押されたらリロード（パラメータ付与）する処理
        drawButton.addEventListener('click', function() {
            const currentUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
            window.location.href = currentUrl + '?draw=true&t=' + new Date().getTime();
        });

        // ページ読み込み完了時の判定処理
        window.addEventListener('DOMContentLoaded', async function() {
            const urlParams = new URLSearchParams(window.location.search);
            if (!urlParams.has('draw')) {
                return;
            }

            drawButton.textContent = 'もう一度占う';

            try {
                const url = `https://${MICROCMS_SERVICE_DOMAIN}.microcms.io/api/v1/${ENDPOINT}?limit=80`;

                const response = await fetch(url, {
                    headers: {
                        'X-MICROCMS-API-KEY': MICROCMS_API_KEY
                    }
                });

                if (!response.ok) {
                    throw new Error(`APIエラー: ${response.status} ${response.statusText}`);
                }

                const data = await response.json();
                const allCards = data.contents;

                if (!allCards || allCards.length === 0) {
                    alert('microCMSにカードデータが登録されていません。');
                    return;
                }

                // 正位置（末尾がN）のカードのみフィルタリング
                const normalCards = allCards.filter(card => card.code && card.code.endsWith('N'));

                if (normalCards.length === 0) {
                    alert('正位置のカードデータが見つかりませんでした。');
                    return;
                }

                // 正位置カードの中からランダムで1枚選出
                const randomIndex = Math.floor(Math.random() * normalCards.length);
                const selectedCard = normalCards[randomIndex];

                // 画面への反映
                const cardName = selectedCard.title || selectedCard.name || selectedCard.code || 'タロットカード';
                
                if (selectedCard.image && selectedCard.image.url) {
                    cardImg.src = selectedCard.image.url;
                    cardImg.alt = cardName;
                } else {
                    cardImg.src = '';
                    cardImg.alt = '画像なし';
                }

                // 【変更箇所】墨かっこ【】を消去してすっきり配置
                resultTitle.textContent = cardName;
                
                // 固定メッセージ
                const defaultMessage = '生けるものはすべて、いつか生を卒業し、また生を受け魂を磨いていきます。あの子は、あなたの元できっと幸せでした。今は、一つのステージを終えることを祝福してあげましょう。';

                // microCMSの「name」または「description」等からカード固有の文章を取得
                const descriptionText = selectedCard.name || selectedCard.description || selectedCard.text || selectedCard.content || '';
                
                // カード固有の文章がある場合は「固定メッセージ」の前に添えて表示
                if (descriptionText && descriptionText !== cardName) {
                    resultText.textContent = `${descriptionText}\n\n${defaultMessage}`;
                } else {
                    resultText.textContent = defaultMessage;
                }

                resultArea.style.display = 'block';
                resultArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

            } catch (error) {
                console.error('エラー詳細:', error);
                alert(`通信または処理中にエラーが発生しました:\n${error.message}`);
            }
        });

        resultArea.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });
    </script>
